<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanCart — Order Confirmation</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <div class="logoimg">
        <img class="HeadeLogo" onclick="window.location.href='index.html';" src="imges/Logo.png" alt="UrbanCart logo">
      </div>
      <div class="HeadeLogo_Name">
        <p class="LogoName" onclick="window.location.href='index.html';">UrbanCart</p>
      </div>
    </div>
    <nav class="Nav">
      <div class="Shop">
        <a href="index.html">Shop</a>
      </div>
      <div class="Cart">
        <a href="cart.html" class="cart-icon">
          <img src="imges/cart.png" alt="Cart logo">
          <span>Cart</span>
          <span id="cart-count" class="badge">0</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="confirmation-page">
    <section class="confirmation-top">
      <div class="confirmation-icon">✓</div>
      <h1>Order Confirmed!</h1>
      <p>Thank you for your purchase. Your order has been placed successfully.</p>
      <div class="order-number-card">
        <span>ORDER NUMBER</span>
        <strong id="orderId">--</strong>
      </div>
    </section>
    <section class="confirmation-summary-card">
      <div class="summary-card">
        <h2>Order Summary</h2>
        <div id="confirmationItems" class="summary-items"></div>
        <div class="summary-row total-row">
          <strong>Total</strong>
          <strong id="orderTotal">--</strong>
        </div>
      </div>
      <button class="checkout-button" onclick="window.location.href='index.html'">Continue Shopping</button>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 UrbanCart. Built for learning JavaScript.</p>
  </footer>

  <script src="confirmation.js"></script>
</body>
</html>
