<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanCart | Order Confirmed</title>
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body data-page="confirmation">

    <div class="container text-center">
        <div id="view-success" class="view active">
            <div class="success-wrap">
                <div class="check-icon" style="font-size: 60px; color: #27ae60; margin-bottom: 20px;">
                    <i class="fas fa-check-circle"></i>
                </div>
                
                <h1>Order Confirmed!</h1>
                <p>Thank you for your purchase. Your order has been placed successfully.</p>

                <div class="order-number-box">
                    <small>ORDER NUMBER</small><br>
                    <strong style="font-size: 1.2rem;">UC-MM3T5YJH-BG3EML</strong>
                </div>

                <div style="margin-top: 30px;">
                    <button class="btn-main" onclick="clearCartAndGoHome()">
                        Continue Shopping
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer style="text-align: center; margin-top: 50px; color: #888;">
        <p>&copy; 2026 UrbanCart. All rights reserved.</p>
    </footer>

    <script>
        // Function to clear the cart and go back to the first page
        function clearCartAndGoHome() {
            localStorage.removeItem('urbanCart'); // Clears the saved items
            window.location.href = 'cart.html'; // Change this to your 1st page name
        }
    </script>
</body>
</html>
