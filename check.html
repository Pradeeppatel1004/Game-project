<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanCart — Checkout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
  <header>
  </header>
  <main>  
<div class="container">
    <div class="stepper" id="checkout-stepper" style="display:none;">
        <div class="step active"><span>1</span><p>Cart</p></div>
        <div class="step active"><span>2</span><p>Shipping</p></div>
        <div class="step active"><span>3</span><p>Payment</p></div>
        <div class="step" id="step-confirm"><span>4</span><p>Confirmation</p></div>
    </div>
      <form id="view-checkout" class="view" onsubmit="event.preventDefault(); finalizeOrder();">
                <div class="checkout-block">
                    <h2 class="section-title">Shipping Information</h2>
                    <div class="form-card">
                        <div class="f-row">
                            <div class="f-group"><label>First Name</label><input type="text" placeholder="John" required></div>
                            <div class="f-group"><label>Last Name</label><input type="text" placeholder="Doe" required></div>
                        </div>
                        <div class="f-row">
                            <div class="f-group"><label>Email</label><input type="email" placeholder="john@example.com" required></div>
                            <div class="f-group"><label>Phone</label><input type="text" placeholder="(555) 123-4567" required></div>
                        </div>
                        <div class="f-group full"><label>Address</label><input type="text" placeholder="123 Main Street" required></div>
                        <div class="f-row triplet">
                            <div class="f-group"><label>City</label><input type="text" placeholder="New York" required></div>
                            <div class="f-group"><label>State</label><input type="text" placeholder="NY" required></div>
                            <div class="f-group"><label>ZIP Code</label><input type="text" placeholder="10001" required></div>
                        </div>
                    </div>
                </div>
     <div class="checkout-block">
                    <h2 class="section-title">Payment Information</h2>
                    <div class="form-card">
                        <div class="f-group full"><label>Cardholder Name</label><input type="text" placeholder="John Doe" required></div>
                        <div class="f-group full"><label>Card Number</label><input type="text" placeholder="1234 5678 9012 3456" required></div>
                        <div class="f-row">
                            <div class="f-group"><label>Expiry (MM/YY)</label><input type="text" placeholder="12/28" required></div>
                            <div class="f-group"><label>CVV</label><input type="password" placeholder="123" required></div>
                        </div>
                    </div>
                </div>
   
      <button type="submit" class="btn-main place-order-btn">Place Order</button>
            </form>
  </main>
  <footer>
    <p>&copy; 2026 UrbanCart. All rights reserved.</p>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
