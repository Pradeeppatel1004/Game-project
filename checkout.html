<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanCart — Checkout</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <div class="logoimg">
        <img class="HeadeLogo" onclick="window.location.href='index.html';" src="imges/Logo.png" alt="UrbanCart logo">
      </div>
      <div class="HeadeLogo_Name">
        <p class="LogoName" onclick="window.location.href='index.html';">UrbanCart</p>
      </div>
    </div>
    <nav class="Nav">
      <div class="Shop">
        <a href="index.html">Shop</a>
      </div>
      <div class="Cart">
        <a href="cart.html" class="cart-icon">
          <img src="imges/cart.png" alt="Cart logo">
          <span>Cart</span>
          <span id="cart-count" class="badge">0</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="checkout-page">
    <section class="checkout-steps">
      <div class="step step-complete" data-step="cart">
        <span>1</span>
        <p>Cart</p>
      </div>
      <div class="step-line completed"></div>
      <div class="step step-complete" data-step="shipping">
        <span>2</span>
        <p>Shipping</p>
      </div>
      <div class="step-line active"></div>
      <div class="step step-active" data-step="payment">
        <span>3</span>
        <p>Payment</p>
      </div>
      <div class="step-line"></div>
      <div class="step step-upcoming" data-step="confirmation">
        <span>4</span>
        <p>Confirmation</p>
      </div>
    </section>

    <section class="checkout-content">
      <div class="checkout-form-panel">
        <div class="form-card" id="shippingSection">
          <div class="card-heading">
            <h2>Shipping Information</h2>
          </div>
          <div class="grid-2">
            <label>
              <span>First Name</span>
              <input type="text" id="firstName" placeholder="John">
            </label>
            <label>
              <span>Last Name</span>
              <input type="text" id="lastName" placeholder="Doe">
            </label>
          </div>
          <div class="grid-2">
            <label>
              <span>Email</span>
              <input type="email" id="email" placeholder="john@example.com">
            </label>
            <label>
              <span>Phone</span>
              <input type="tel" id="phone" placeholder="(555) 123-4567">
            </label>
          </div>
          <label>
            <span>Address</span>
            <input type="text" id="address" placeholder="123 Main Street">
          </label>
          <div class="grid-3">
            <label>
              <span>City</span>
              <input type="text" id="city" placeholder="New York">
            </label>
            <label>
              <span>State</span>
              <input type="text" id="state" placeholder="NY">
            </label>
            <label>
              <span>ZIP Code</span>
              <input type="text" id="zip" placeholder="10001">
            </label>
          </div>
        </div>

        <div class="form-card" id="paymentSection">
          <div class="card-heading">
            <h2>Payment Information</h2>
          </div>
          <label>
            <span>Cardholder Name</span>
            <input type="text" id="cardName" placeholder="John Doe">
          </label>
          <label>
            <span>Card Number</span>
            <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456">
          </label>
          <div class="grid-2">
            <label>
              <span>Expiry (MM/YY)</span>
              <input type="text" id="expiry" placeholder="12/28">
            </label>
            <label>
              <span>CVV</span>
              <input type="text" id="cvv" placeholder="123">
            </label>
          </div>
          <button id="placeOrderButton" class="checkout-button">Place Order</button>
        </div>
      </div>

      <aside class="checkout-summary">
        <div class="summary-card">
          <h2>Order Summary</h2>
          <div id="checkoutItems" class="summary-items"></div>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="checkoutSubtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>FREE</span>
          </div>
          <div class="summary-row">
            <span>Tax</span>
            <span id="checkoutTax">$0.00</span>
          </div>
          <div class="summary-row total-row">
            <strong>Total</strong>
            <strong id="checkoutTotal">$0.00</strong>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 UrbanCart. Built for learning JavaScript.</p>
  </footer>

  <script src="checkout.js"></script>
</body>
</html>
