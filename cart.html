<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanCart — Cart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>
  <header class="navbar cart-navbar">
    <div class="logo">
      <div class="logoimg">
        <img class="HeadeLogo" onclick="window.location.href='index.html';" src="imges/Logo.png" alt="UrbanCart logo">
      </div>
      <div class="HeadeLogo_Name">
        <p class="LogoName" onclick="window.location.href='index.html';">UrbanCart</p>
      </div>
    </div>
    <nav class="Nav">
      <div class="Shop">
        <a href="index.html">Shop</a>
      </div>
      <div class="Cart">
        <a href="cart.html" class="cart-icon active">
          <img src="imges/cart.png" alt="Cart logo">
          <span>Cart</span>
          <span id="cart-count" class="badge">0</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="cart-page">
    <section class="cart-header">
      <div>
        <h1>Shopping Cart</h1>
        <p>Review your items, update quantities, or continue shopping.</p>
      </div>
    </section>

    <section id="emptyCart" class="empty-state hidden">
      <div class="empty-icon">🛒</div>
      <h2>Your cart is empty</h2>
      <p>Looks like you haven't added anything to your cart yet.</p>
      <a href="index.html" class="button">Continue Shopping</a>
    </section>

    <section id="cartWrapper" class="cart-wrapper hidden">
      <div class="cart-items" id="cartItems"></div>
      <aside class="cart-summary" id="cartSummary"></aside>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 UrbanCart. Built for learning JavaScript.</p>
  </footer>

  <script src="cart.js"></script>
</body>
</html>
